# Publishes this library to Maven Central (https://central.sonatype.com/).
#
# Trigger: publishing a GitHub Release (Releases -> Draft a new release -> Publish release).
# This is the "on demand" trigger for this workflow -- it never runs from a pull request or a
# plain push. The release's target branch must be `main`; releases cut from any other branch
# are rejected by the `verify-release-branch` step below.
#
# Before this workflow can succeed, the following repository secrets must exist
# Settings -> Secrets and variables -> Actions
#
#   CENTRAL_PORTAL_USERNAME       user token username from
#                                  https://central.sonatype.com/account (Generate User Token).
#   CENTRAL_PORTAL_PASSWORD       user token password from the same page.
#   CENTRAL_SIGNING_KEY           ASCII-armored PGP private key used to sign
#                                  artifacts, e.g. output of:
#                                    gpg --export-secret-keys --armor <KEY_ID>
#                                  The corresponding public key must be published to a
#                                  keyserver (e.g. keys.openpgp.org) so Central can verify it.
#   CENTRAL_SIGNING_KEY_PASSWORD  passphrase for the PGP private key above.
#

name: Publish to Maven Central

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  publish:
    environment: sonatype
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # Only allow releases cut from main. Release creation is the "on demand" trigger for this
    # workflow; this check keeps that trigger scoped to the main branch as required.
    if: github.event.release.target_commitish == 'main'
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      # Forces a real (non-SNAPSHOT) release version, see the version logic in build.gradle.
      ORG_GRADLE_PROJECT_releaseBuild: "true"
      ORG_GRADLE_PROJECT_centralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      ORG_GRADLE_PROJECT_centralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.CENTRAL_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.CENTRAL_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Print JDK Version
        run: java -version

      - name: Make gradlew Executable
        run: chmod +x gradlew

      - name: Compute Library Version
        run: echo "LIB_VERSION=$(./scripts/lib_version.sh)" >> "$GITHUB_ENV"

      - name: Build and Test
        run: ./gradlew --no-daemon --parallel clean check

      - name: Sign and Publish to Maven Central
        run: ./gradlew --no-daemon --parallel publish

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/.out/test-results/test/TEST-*.xml'